<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#4f46e5">
<title>Flat Khata</title>
<link rel="manifest" href="manifest.json">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#f1f5f9; --card:#ffffff; --text:#0f172a; --muted:#64748b;
    --green:#16a34a; --green-l:#f0fdf4;
    --red:#dc2626;  --red-l:#fef2f2;
    --indigo:#4f46e5; --indigo-l:#eef2ff;
    --border:#e2e8f0;
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;
    padding-bottom:40px;
  }
  .app{max-width:520px;margin:0 auto;padding:14px 12px 0}

  header{margin-bottom:14px}
  .mlabel{display:block;font-size:11px;font-weight:800;text-transform:uppercase;
          letter-spacing:.7px;color:var(--muted);margin-bottom:6px;padding-left:2px}
  #monthPicker{
    width:100%;padding:13px 14px;border:1.5px solid var(--border);background:#fff;
    border-radius:14px;font-size:16px;font-family:inherit;font-weight:700;
    color:var(--text);outline:none;transition:.15s;
  }
  #monthPicker:focus{border-color:#0f172a;box-shadow:0 0 0 3px #e2e8f0}

  /* ---- 3 TABS ---- */
  .tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
  .tab{
    border:2px solid transparent;background:var(--card);border-radius:16px;
    padding:12px 8px;text-align:left;cursor:pointer;font-family:inherit;
    transition:.18s;box-shadow:0 1px 3px rgba(15,23,42,.05);
  }
  .tab .tl{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .tab .tv{font-size:17px;font-weight:800;letter-spacing:-.5px;margin-top:3px}
  .tab.rev .tv{color:var(--green)}
  .tab.exp .tv{color:var(--red)}
  .tab.bal .tv{color:var(--indigo)}
  .tab.rev.active{border-color:var(--green);background:var(--green-l);box-shadow:0 4px 14px rgba(22,163,74,.14)}
  .tab.exp.active{border-color:var(--red);background:var(--red-l);box-shadow:0 4px 14px rgba(220,38,38,.14)}
  .tab.bal.active{border-color:var(--indigo);background:var(--indigo-l);box-shadow:0 4px 14px rgba(79,70,229,.14)}
  .tab:active{transform:scale(.985)}

  .panel{display:none}
  .panel.active{display:block;animation:fade .18s ease}
  @keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

  /* ---- REVENUE ---- */
  .rev-row{display:flex;gap:8px;margin-bottom:9px;align-items:center}
  .rev-row input{
    border:1.5px solid var(--border);background:#fff;border-radius:13px;
    padding:13px 12px;font-size:15px;font-family:inherit;color:var(--text);
    outline:none;transition:.15s;
  }
  .rev-row input:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-l)}
  .in-name{flex:1;min-width:0;font-weight:600}
  .in-amt{width:112px;text-align:right;font-weight:800}
  .in-amt::-webkit-outer-spin-button,.in-amt::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .in-amt{-moz-appearance:textfield}

  /* ---- EXPENSE FORM ---- */
  .exp-form{
    background:var(--card);border:1px solid var(--border);border-radius:16px;
    padding:12px;margin-bottom:14px;box-shadow:0 1px 3px rgba(15,23,42,.05);
  }
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
  .frow:last-child{margin-bottom:0}
  .frow.two{grid-template-columns:1fr 58px}
  .frow input{
    width:100%;padding:12px;border:1.5px solid var(--border);background:#f8fafc;
    border-radius:12px;font-size:15px;font-family:inherit;color:var(--text);
    outline:none;transition:.15s;min-width:0;
  }
  .frow input:focus{border-color:var(--red);background:#fff;box-shadow:0 0 0 3px var(--red-l)}
  .frow input::-webkit-outer-spin-button,.frow input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .frow input[type=number]{-moz-appearance:textfield}
  .addbtn{
    border:none;background:var(--red);color:#fff;border-radius:12px;
    font-size:24px;font-weight:700;font-family:inherit;cursor:pointer;
    line-height:1;transition:.15s;display:flex;align-items:center;justify-content:center;
  }
  .addbtn:active{background:#b91c1c;transform:scale(.96)}

  .exp-item{
    display:flex;align-items:center;gap:10px;background:var(--card);
    border:1px solid var(--border);border-radius:14px;padding:11px 12px;
    margin-bottom:8px;box-shadow:0 1px 2px rgba(15,23,42,.04);
  }
  .exp-item .info{flex:1;min-width:0}
  .exp-item .it{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .exp-item .id{font-size:12px;color:var(--muted);margin-top:1px}
  .exp-item .amt{font-size:15px;font-weight:800;color:var(--red);white-space:nowrap}
  .exp-item .del{
    border:none;background:var(--red-l);color:var(--red);width:27px;height:27px;
    border-radius:9px;font-size:13px;font-weight:800;cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }

  .sumline{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 4px 6px;margin-top:8px;border-top:1.5px dashed var(--border);
    font-size:13px;font-weight:700;color:var(--muted);
    text-transform:uppercase;letter-spacing:.5px;
  }
  .sumline b{font-size:19px;letter-spacing:-.4px;color:var(--green)}
  .sumline.red b{color:var(--red)}

  /* ---- ACTION BUTTONS ---- */
  .action-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .abtn{
    padding:13px 10px;border:none;border-radius:14px;font-size:14px;font-weight:700;
    display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;
    transition:.15s;box-shadow:0 2px 5px rgba(0,0,0,.05);font-family:inherit;
  }
  .abtn:active{transform:scale(.97)}
  .abtn.pdf{background:#fff;border:1.5px solid var(--border);color:var(--text)}
  .abtn.wa{background:#25D366;color:#fff}

  /* ---- BALANCE PANEL ---- */
  .bal-box{
    background:var(--card);border:1px solid var(--border);border-radius:20px;
    padding:22px 18px;box-shadow:0 2px 8px rgba(15,23,42,.06);text-align:center;
  }
  .bal-lbl{font-size:11.5px;font-weight:800;text-transform:uppercase;
           letter-spacing:.7px;color:var(--muted);margin-bottom:6px}
  .bal-val{
    font-size:38px;font-weight:800;letter-spacing:-1.2px;
    color:var(--indigo);margin-bottom:6px;cursor:pointer;user-select:none;
    transition:.15s;
  }
  .bal-val:active{transform:scale(.97)}
  .bal-val.neg{color:var(--red)}
  .tap-hint{
    font-size:11px;color:var(--muted);margin-bottom:16px;
    font-weight:600;display:flex;align-items:center;justify-content:center;gap:4px;
  }
  .tap-hint .arrow{
    display:inline-block;transition:transform .2s;
  }
  .tap-hint.open .arrow{transform:rotate(180deg)}
  
  .bal-rows{text-align:left;border-top:1.5px dashed var(--border);padding-top:14px}
  .bal-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;font-size:14px;font-weight:600;color:var(--muted)}
  .bal-row span:first-child{color:#475569}
  .bal-row b{font-size:15px;font-weight:800;letter-spacing:-.3px}
  .bal-row .g{color:var(--green)}
  .bal-row .r{color:var(--red)}
  .bal-row.total{border-top:1px solid var(--border);margin-top:4px;padding-top:12px;font-size:14px;color:var(--text)}
  .bal-row.total b{font-size:17px;color:var(--indigo)}
  .bal-row.total b.neg{color:var(--red)}

  /* ---- CHART ---- */
  .chart-wrap{display:none;margin-top:14px}
  .chart-wrap.show{display:block;animation:slideDown .28s ease}
  @keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  
  .chart-card{
    background:var(--card);border:1px solid var(--border);border-radius:20px;
    padding:18px 16px;box-shadow:0 2px 8px rgba(15,23,42,.06);
  }
  .chart-card h3{
    font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;
    color:var(--muted);margin-bottom:16px;text-align:center;
  }
  .donut-box{
    width:200px;height:200px;margin:0 auto 18px;position:relative;
  }
  .donut-svg{width:100%;height:100%;display:block}
  .legend{display:flex;flex-direction:column;gap:0}
  .lg-row{
    display:flex;align-items:center;gap:9px;font-size:13px;
    padding:9px 2px;border-bottom:1px dashed var(--border);
  }
  .lg-row:last-child{border-bottom:none}
  .lg-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 2px #fff inset}
  .lg-name{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#334155}
  .lg-pct{font-weight:700;color:var(--muted);font-size:11.5px;background:#f1f5f9;padding:2px 7px;border-radius:6px}
  .lg-amt{font-weight:800;color:var(--red);min-width:62px;text-align:right;font-size:13px}

  .empty{text-align:center;color:#94a3b8;font-size:13.5px;padding:26px 0}

  /* ---- PRINT / PDF STYLES ---- */
  #print-section { display: none; }
  @media print {
    body * { visibility: hidden; }
    #print-section, #print-section * { visibility: visible; }
    #print-section {
      display: block !important;
      position: absolute; left: 0; top: 0; width: 100%;
      padding: 20px; font-family: Arial, sans-serif; color: #000;
    }
    .p-head { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #000; padding-bottom: 10px; }
    .p-head h2 { margin: 0 0 5px 0; }
    .p-head p { margin: 0; font-size: 14px; color: #555; }
    .p-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    .p-table th, .p-table td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 14px; }
    .p-table th { background: #f5f5f5; }
    .p-table td:last-child, .p-table th:last-child { text-align: right; }
    .p-total { text-align: right; font-size: 18px; font-weight: bold; margin-top: 10px; border-top: 2px solid #000; padding-top: 10px; }
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <label class="mlabel" for="monthPicker">Month &amp; Year</label>
    <input type="month" id="monthPicker">
  </header>

  <div class="tabs">
    <button class="tab rev active" data-tab="revenue">
      <div class="tl">Revenue</div>
      <div class="tv" id="revTotal">₹0</div>
    </button>
    <button class="tab exp" data-tab="expense">
      <div class="tl">Expenses</div>
      <div class="tv" id="expTotal">₹0</div>
    </button>
    <button class="tab bal" data-tab="balance">
      <div class="tl">Balance</div>
      <div class="tv" id="balTotal">₹0</div>
    </button>
  </div>

  <!-- ===== REVENUE PANEL ===== -->
  <section class="panel active" id="panel-revenue">
    <div id="revList"></div>
    <div class="sumline"><span>Total Revenue</span><b id="revSum">₹0</b></div>
  </section>

  <!-- ===== EXPENSE PANEL ===== -->
  <section class="panel" id="panel-expense">
    <form class="exp-form" id="expForm" autocomplete="off">
      <div class="frow">
        <input type="date" name="date" required>
        <input type="text" name="item" placeholder="Item" required>
      </div>
      <div class="frow two">
        <input type="number" name="amount" inputmode="decimal" min="1" step="1" placeholder="₹ Amount" required>
        <button type="submit" class="addbtn">+</button>
      </div>
    </form>

    <div class="action-btns">
      <button class="abtn pdf" id="btnPDF">📄 Export PDF</button>
      <button class="abtn wa" id="btnWA">💬 Share WhatsApp</button>
    </div>

    <div id="expList"></div>
    <div class="sumline red"><span>Total Expenses</span><b id="expSum">₹0</b></div>
  </section>

  <!-- ===== BALANCE PANEL ===== -->
  <section class="panel" id="panel-balance">
    <div class="bal-box">
      <div class="bal-lbl">Remaining Balance</div>
      <div class="bal-val" id="balBig">₹0</div>
      <div class="tap-hint" id="tapHint">
        <span>Tap balance to see breakdown</span>
        <span class="arrow">▾</span>
      </div>
      <div class="bal-rows">
        <div class="bal-row"><span>Total Revenue</span><b class="g" id="bRev">₹0</b></div>
        <div class="bal-row"><span>Total Expenses</span><b class="r" id="bExp">₹0</b></div>
        <div class="bal-row total"><span>= Remaining</span><b id="bRes">₹0</b></div>
      </div>
    </div>

    <!-- CHART (hidden by default, opens on tap) -->
    <div class="chart-wrap" id="chartWrap">
      <div class="chart-card">
        <h3>📊 Expense Breakdown</h3>
        <div class="donut-box" id="donutBox"></div>
        <div class="legend" id="chartLegend"></div>
      </div>
    </div>
  </section>

</div>

<!-- Hidden Print Section for PDF -->
<div id="print-section">
  <div class="p-head">
    <h2>Flat Khata - Expenses</h2>
    <p id="pMonth"></p>
  </div>
  <table class="p-table">
    <thead>
      <tr>
        <th>Date</th>
        <th>Item</th>
        <th>Amount</th>
      </tr>
    </thead>
    <tbody id="pBody"></tbody>
  </table>
  <div class="p-total" id="pTotal"></div>
</div>

<script>
/* ================= HELPERS ================= */
const LS    = 'flatkhata_v3';
const uid   = () => Math.random().toString(36).slice(2, 9);
const ym    = d  => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
const today = () => new Date().toISOString().slice(0, 10);
const fmt   = n  => '₹' + Number(n || 0).toLocaleString('en-IN');
const esc   = s  => String(s == null ? '' : s).replace(/[&<>"']/g,
                    m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const $     = id => document.getElementById(id);

/* ================= STATE ================= */
let state = (() => {
  try {
    const raw = localStorage.getItem(LS);
    if (raw) {
      const s = JSON.parse(raw);
      if (s && s.months) { if (!s.month) s.month = ym(new Date()); return s; }
    }
  } catch (e) {}
  return { month: ym(new Date()), months: {} };
})();
const save = () => localStorage.setItem(LS, JSON.stringify(state));

function getMonth(m) {
  if (!state.months[m]) {
    let names = null;
    const keys = Object.keys(state.months).sort();
    for (let i = keys.length - 1; i >= 0; i--) {
      const rv = state.months[keys[i]].revenue;
      if (rv && rv.length) { names = rv.map(x => x.name); break; }
    }
    if (!names) names = ['Flatmate 1','Flatmate 2','Flatmate 3','Flatmate 4','Flatmate 5','Flatmate 6'];
    state.months[m] = {
      revenue: names.map(n => ({ id: uid(), name: n, amount: 0 })),
      expenses: []
    };
  }
  return state.months[m];
}

/* ================= RENDER ================= */
function renderRevenue() {
  const md = getMonth(state.month);
  $('revList').innerHTML = md.revenue.map(r => `
    <div class="rev-row">
      <input class="in-name" data-id="${r.id}" type="text" value="${esc(r.name)}" placeholder="Name">
      <input class="in-amt" data-id="${r.id}" type="number" inputmode="decimal" min="0" step="1"
             value="${r.amount ? r.amount : ''}" placeholder="0">
    </div>
  `).join('');
}

function renderExpenses() {
  const md   = getMonth(state.month);
  const list = md.expenses.slice().sort((a, b) => b.date.localeCompare(a.date));
  const el   = $('expList');
  if (!list.length) { el.innerHTML = '<p class="empty">Abhi koi kharcha nahi likha</p>'; return; }
  el.innerHTML = list.map(e => `
    <div class="exp-item">
      <div class="info">
        <div class="it">${esc(e.item)}</div>
        <div class="id">${e.date}</div>
      </div>
      <div class="amt">${fmt(e.amount)}</div>
      <button class="del" data-id="${e.id}" aria-label="delete">✕</button>
    </div>
  `).join('');
}

function updateTotals() {
  const md  = getMonth(state.month);
  const rev = md.revenue.reduce((s, r) => s + (Number(r.amount) || 0), 0);
  const exp = md.expenses.reduce((s, e) => s + (Number(e.amount) || 0), 0);
  const bal = rev - exp;

  $('revTotal').textContent = fmt(rev);
  $('expTotal').textContent = fmt(exp);
  $('balTotal').textContent = fmt(bal);
  $('balTotal').style.color = bal < 0 ? 'var(--red)' : 'var(--indigo)';

  $('revSum').textContent = fmt(rev);
  $('expSum').textContent = fmt(exp);

  $('balBig').textContent = fmt(bal);
  $('balBig').classList.toggle('neg', bal < 0);
  $('bRev').textContent = fmt(rev);
  $('bExp').textContent = fmt(exp);
  $('bRes').textContent = fmt(bal);
  $('bRes').classList.toggle('neg', bal < 0);

  // Agar chart khula hai to use bhi refresh karo
  if (chartVisible) buildChart();
}

function renderAll() {
  $('monthPicker').value = state.month;
  renderRevenue();
  renderExpenses();
  updateTotals();
}

/* ================= CHART (DONUT) ================= */
let chartVisible = false;
const COLORS = ['#ef4444','#f97316','#eab308','#22c55e','#3b82f6',
                '#8b5cf6','#ec4899','#06b6d4','#84cc16','#f43f5e',
                '#14b8a6','#a855f7'];

function toggleChart() {
  chartVisible = !chartVisible;
  const wrap = $('chartWrap');
  const hint = $('tapHint');

  if (chartVisible) {
    buildChart();
    wrap.classList.add('show');
    hint.classList.add('open');
    hint.firstElementChild.textContent = 'Tap balance to hide';
  } else {
    wrap.classList.remove('show');
    hint.classList.remove('open');
    hint.firstElementChild.textContent = 'Tap balance to see breakdown';
  }
}

function buildChart() {
  const md  = getMonth(state.month);
  const box = $('donutBox');
  const lg  = $('chartLegend');

  if (!md.expenses.length) {
    box.innerHTML = '<div class="empty" style="padding:60px 0">Koi kharcha nahi hai</div>';
    lg.innerHTML  = '';
    return;
  }

  // Same item naam wale ko group karo (case-insensitive)
  const groups = {};
  md.expenses.forEach(e => {
    const key = (e.item || 'other').trim().toLowerCase();
    if (!groups[key]) groups[key] = { label: (e.item || 'Other').trim(), value: 0 };
    groups[key].value += Number(e.amount) || 0;
  });

  const sorted = Object.values(groups).sort((a, b) => b.value - a.value);
  const total  = sorted.reduce((s, g) => s + g.value, 0);

  // Donut circles banao
  const cx = 100, cy = 100, r = 72, sw = 28;
  const circ = 2 * Math.PI * r;
  let offset = 0;
  let paths  = '';

  sorted.forEach((g, i) => {
    const frac  = g.value / total;
    const dash  = frac * circ;
    const color = COLORS[i % COLORS.length];
    g.color = color;

    paths += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}"
              stroke-width="${sw}" stroke-dasharray="${dash} ${circ - dash}"
              stroke-dashoffset="${-offset}"
              transform="rotate(-90 ${cx} ${cy})"
              style="transition:stroke-dasharray .3s" />`;
    offset += dash;
  });

  // Center me Total likho
  paths += `<text x="${cx}" y="94" text-anchor="middle" fill="#64748b"
            font-size="9" font-weight="800" letter-spacing="0.6" font-family="Arial">TOTAL</text>`;
  paths += `<text x="${cx}" y="116" text-anchor="middle" fill="#0f172a"
            font-size="16" font-weight="800" font-family="Arial">${fmt(total)}</text>`;

  box.innerHTML = `<svg viewBox="0 0 200 200" class="donut-svg">${paths}</svg>`;

  // Legend
  lg.innerHTML = sorted.map(g => {
    const pct = ((g.value / total) * 100).toFixed(1);
    return `<div class="lg-row">
      <span class="lg-dot" style="background:${g.color}"></span>
      <span class="lg-name">${esc(g.label)}</span>
      <span class="lg-pct">${pct}%</span>
      <span class="lg-amt">${fmt(g.value)}</span>
    </div>`;
  }).join('');
}

/* ================= EVENTS ================= */
$('monthPicker').addEventListener('change', e => {
  if (e.target.value) { state.month = e.target.value; save(); renderAll(); }
});

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    $('panel-' + t.dataset.tab).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});

$('revList').addEventListener('input', e => {
  const el = e.target, id = el.dataset.id;
  if (!id) return;
  const row = getMonth(state.month).revenue.find(r => r.id === id);
  if (!row) return;
  if (el.classList.contains('in-name')) row.name   = el.value;
  else                                  row.amount = Number(el.value) || 0;
  save();
  updateTotals();
});

$('expForm').addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  const date   = f.date.value || today();
  const item   = f.item.value.trim();
  const amount = Number(f.amount.value);
  if (!item)                  return alert('Item ka naam likho');
  if (!amount || amount <= 0) return alert('Sahi amount daalo');

  getMonth(state.month).expenses.push({ id: uid(), date, item, amount });
  save();

  f.reset(); f.date.value = today();
  renderExpenses(); updateTotals(); f.item.focus();
});

$('expList').addEventListener('click', e => {
  const b = e.target.closest('.del');
  if (!b) return;
  const md = getMonth(state.month);
  md.expenses = md.expenses.filter(x => x.id !== b.dataset.id);
  save(); renderExpenses(); updateTotals();
});

/* Click on big balance → toggle chart */
$('balBig').addEventListener('click', toggleChart);

/* ================= PDF & WHATSAPP ================= */
$('btnPDF').addEventListener('click', () => {
  const md = getMonth(state.month);
  if (!md.expenses.length) return alert('Koi kharcha nahi hai PDF banane ke liye.');

  $('pMonth').textContent = 'Month: ' + state.month;
  const sorted = md.expenses.slice().sort((a,b) => a.date.localeCompare(b.date));
  let tbody = '', total = 0;

  sorted.forEach(e => {
    tbody += `<tr><td>${e.date}</td><td>${esc(e.item)}</td><td>${fmt(e.amount)}</td></tr>`;
    total += Number(e.amount);
  });

  $('pBody').innerHTML = tbody;
  $('pTotal').textContent = 'Total Expenses: ' + fmt(total);
  window.print();
});

$('btnWA').addEventListener('click', () => {
  const md = getMonth(state.month);
  if (!md.expenses.length) return alert('Koi kharcha nahi hai share karne ke liye.');

  let text = `*🏠 Flat Khata - Expenses*\n📅 *Month:* ${state.month}\n\n`;
  let total = 0;
  const sorted = md.expenses.slice().sort((a,b) => b.date.localeCompare(a.date));

  sorted.forEach((e, index) => {
    text += `${index + 1}. ${e.date} | *${esc(e.item)}* - ${fmt(e.amount)}\n`;
    total += Number(e.amount);
  });

  text += `\n💰 *Total Kharcha: ${fmt(total)}*`;

  if (navigator.share) {
    navigator.share({ title: 'Flat Khata Expenses', text: text })
      .catch(err => console.log('Share failed', err));
  } else {
    window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
  }
});

/* ================= INIT ================= */
$('expForm').date.value = today();
renderAll();
</script>
</body>
</html>
